<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>snurra</title>
    <script>
      // Temporary: the public deployment lives under /snurra/ and needs the trailing slash.
      // The query string and hash are kept.
      var url = new URL(location.href);
      if (url.origin === "https://hannesp.se" && url.pathname === "/snurra") {
        url.pathname = "/snurra/";
        location.replace(url.href);
      }
    </script>
    <script type="module" crossorigin src="./assets/main-fKYHRtJ7.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BE2RYwtS.css">
  </head>
  <body>
    <header>
      <h1>snurra</h1>
      <div class="header-actions">
        <button type="button" id="problems-badge" hidden></button>
        <div class="views" role="group" aria-label="View">
          <button type="button" data-view="code-results" title="Code, with the results beside it">Code &amp; results</button>
          <button type="button" data-view="inputs-results" title="Inputs and results only, without the code">Inputs &amp; results</button>
          <button type="button" data-view="output" title="Results only, without the code or the inputs">Results</button>
        </div>
        <button type="button" id="share" title="Copy a link that holds this whole document">Share</button>
        <div class="menu">
          <button type="button" class="menu-button" aria-haspopup="true" aria-expanded="false">Settings</button>
          <div class="menu-popup" role="group" aria-label="Settings" hidden>
            <label class="menu-item"><input type="checkbox" id="line-numbers" /> Show line numbers</label>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="menu-button" aria-haspopup="true" aria-expanded="false">Help</button>
          <div class="menu-popup" role="group" aria-label="Help" hidden>
            <button type="button" class="menu-item submenu-button" id="tutorial-start" aria-haspopup="true" aria-expanded="false" title="Learn the language, one chapter at a time">Tutorial</button>
            <div class="submenu-list" id="tutorial-list" role="group" aria-label="Tutorial chapters" hidden></div>
            <a class="menu-item" href="docs.html">Documentation</a>
            <button type="button" class="menu-item submenu-button" id="examples-button" aria-haspopup="true" aria-expanded="false">Examples</button>
            <div class="submenu-list" id="examples-list" role="group" aria-label="Examples" hidden></div>
          </div>
        </div>
      </div>
    </header>
    <main data-view="code-results">
      <section id="editor" aria-label="Document"></section>
      <aside>
        <div id="sheet-tabs" role="tablist" aria-label="Sheets" hidden></div>
        <div class="pane" id="pane-inputs">
          <section aria-label="Inputs">
            <p class="hint" id="inputs-hint">Inputs are lines that are just a value, like price = 100, rate = 5%, city = "Oslo", due = 2024-03-01 or a list or table. Each one gets a field here that anyone can change without touching the code.</p>
            <label class="hidden-toggle" id="hidden-toggle-inputs" hidden>
              <input type="checkbox" id="show-hidden-inputs" />
              <span id="hidden-count-inputs"></span>
            </label>
            <div id="inputs"></div>
          </section>
        </div>
        <div class="pane" id="pane-outputs">
          <section aria-label="Results">
            <label class="hidden-toggle" id="hidden-toggle-results" hidden>
              <input type="checkbox" id="show-hidden-results" />
              <span id="hidden-count-results"></span>
            </label>
            <div id="results"></div>
          </section>
          <section id="problems-section" hidden>
            <h2>Problems</h2>
            <div id="problems"></div>
          </section>
        </div>
      </aside>
    </main>
    <script>
      // Before the first paint: the module below runs later, and until then the page would show the default view
      // and no line numbers, then jump to the saved ones. Mirrors what main.ts does (see setViewMode and setLineNumbers).
      (function () {
        try {
          var modes = ["code-results", "inputs-results", "output"];
          var legacy = { split: "code-results", code: "code-results", calculator: "inputs-results", results: "inputs-results" };
          var fromHash = /^#view=([a-z-]+)(?:&sheet=.*)?$/.exec(location.hash);
          var saved = localStorage.getItem("snurra:view");
          var mode = (fromHash && modes.indexOf(fromHash[1]) >= 0 && fromHash[1]) || legacy[saved] || (modes.indexOf(saved) >= 0 && saved) || "code-results";
          document.querySelector("main").dataset.view = mode;
          document.querySelectorAll(".views button").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.view === mode));
          });
          if (localStorage.getItem("snurra:line-numbers") === "1") document.querySelector("main").classList.add("line-numbers");
        } catch (e) {}
      })();
    </script>
  </body>
</html>
